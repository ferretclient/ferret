name: 'Run OAuth1 CLI Tests - Linux'
description: 'Run OAuth1 CLI tests on Linux'
runs:
  using: 'composite'
  steps:
    - name: Run FER format CLI tests
      shell: bash
      run: |
        set -euo pipefail

        FER_CLI="../../../../../../packages/ferret-cli/bin/fer.js"

        # navigate to FER test collection directory
        cd tests/auth/oauth1/fixtures/collections/fer

        echo "=== FER Format Collection Run ==="
        node $FER_CLI run --env Local --output junit-fer.xml --format junit

    - name: Run YML format CLI tests
      shell: bash
      run: |
        set -euo pipefail

        FER_CLI="../../../../../../packages/ferret-cli/bin/fer.js"

        # navigate to YML test collection directory
        cd tests/auth/oauth1/fixtures/collections/yml

        echo "=== YML Format Collection Run ==="
        node $FER_CLI run --env Local --output junit-yml.xml --format junit
