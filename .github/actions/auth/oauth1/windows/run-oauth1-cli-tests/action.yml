name: 'Run OAuth1 CLI Tests - Windows'
description: 'Run OAuth1 CLI tests on Windows'
runs:
  using: 'composite'
  steps:
    - name: Run FER format CLI tests
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = "Stop"

        $FER_CLI = "..\..\..\..\..\..\packages\ferret-cli\bin\fer.js"

        # navigate to FER test collection directory
        Set-Location tests\auth\oauth1\fixtures\collections\fer

        Write-Host "=== FER Format Collection Run ==="
        $process = Start-Process -FilePath "node" -ArgumentList "$FER_CLI run --env Local --output junit-fer.xml --format junit" -NoNewWindow -Wait -PassThru -RedirectStandardError "nul"
        if ($process.ExitCode -ne 0) { exit 1 }

    - name: Run YML format CLI tests
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = "Stop"

        $FER_CLI = "..\..\..\..\..\..\packages\ferret-cli\bin\fer.js"

        # navigate to YML test collection directory
        Set-Location tests\auth\oauth1\fixtures\collections\yml

        Write-Host "=== YML Format Collection Run ==="
        $process = Start-Process -FilePath "node" -ArgumentList "$FER_CLI run --env Local --output junit-yml.xml --format junit" -NoNewWindow -Wait -PassThru -RedirectStandardError "nul"
        if ($process.ExitCode -ne 0) { exit 1 }
