name: 'Run Unit Tests'
description: 'Setup dependencies and run unit tests for all packages'
inputs:
  shell:
    description: 'Shell to use (bash, pwsh)'
    required: false
    default: 'bash'
runs:
  using: 'composite'
  steps:
    - name: Test Package ferret-js
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/ferret-js

    - name: Test Package ferret-cli
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/ferret-cli

    - name: Test Package ferret-query
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/ferret-query

    - name: Test Package ferret-lang
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/ferret-lang

    - name: Test Package ferret-schema
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/ferret-schema

    - name: Test Package ferret-app
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/ferret-app

    - name: Test Package ferret-common
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/ferret-common

    - name: Test Package ferret-converters
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/ferret-converters

    - name: Test Package ferret-electron
      shell: ${{ inputs.shell }}
      run: npm run test:ci --workspace=packages/ferret-electron

    - name: Test Package ferret-requests
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/ferret-requests

    - name: Test Package ferret-filestore
      shell: ${{ inputs.shell }}
      run: npm run test --workspace=packages/ferret-filestore
