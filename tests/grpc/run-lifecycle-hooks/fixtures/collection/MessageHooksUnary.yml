info:
  name: MessageHooksUnary
  type: grpc
  seq: 11

grpc:
  url: "{{host}}"
  method: /hello.HelloService/SayHello
  methodType: unary
  metadata:
    - name: x-keep
      value: kept-value
  message:
    - title: message 1
      message: |-
        {
          "greeting": "{{unaryGreeting}}"
        }

runtime:
  scripts:
    - type: grpc:before-call-start
      code: |-
        fer.setVar('unaryGreeting', 'unary-hooks');
        fer.deleteVar('lastReply');
    - type: grpc:before-message-send
      code: |-
        // Interpolation has already run by the time the message is handed to this hook.
        test('the hook is handed the message about to go out', () => {
          expect(fer.grpc.request.message.data.greeting).to.equal('unary-hooks');
          expect(fer.grpc.request.message.timestamp).to.be.a('number');
        });

        // `messages` reports what the call has sent, and this one has yet to send anything.
        test('the message has not joined request.messages yet', () => {
          expect(fer.grpc.request.messages.count()).to.equal(0);
        });

        // Same scope as beforeCallStart — there is nothing to respond with yet.
        test('no response is in scope before the message is sent', () => {
          expect(fer.grpc.response).to.be.undefined;
        });

        test('metadata is read-only once the call is under way', () => {
          expect(fer.grpc.request.metadata.get('x-keep')).to.equal('kept-value');
          expect(() => fer.grpc.request.metadata.upsert('x-late', '1')).to.throw();
        });
    - type: grpc:after-message-receive
      code: |-
        test('the hook is handed the reply that just arrived', () => {
          expect(fer.grpc.response.message.data.reply).to.equal('hello unary-hooks');
          expect(fer.grpc.response.message.timestamp).to.be.a('number');
        });

        test('the reply is also folded into response.messages', () => {
          expect(fer.grpc.response.messages.count()).to.equal(1);
          expect(fer.grpc.response.messages.get(0).data.reply).to.equal('hello unary-hooks');
        });

        // A unary call never streams, so the sent message is rebuilt from the authored body.
        test('the sent message is visible from here', () => {
          expect(fer.grpc.request.messages.count()).to.equal(1);
          expect(fer.grpc.request.messages.get(0).data.greeting).to.equal('unary-hooks');
        });

        // `message` belongs to the request in the send hook and to the response in this one.
        test('the request carries no message in this hook', () => {
          expect(fer.grpc.request.message).to.be.undefined;
        });

        fer.setVar('lastReply', fer.grpc.response.message.data.reply);
    - type: grpc:after-call-end
      code: |-
        // The call is over here, so the fields afterMessageReceive saw as unknown are filled in.
        test('the completed call reports its status and duration', () => {
          expect(fer.grpc.response.statusCode).to.equal(0);
          expect(fer.grpc.response.duration).to.be.a('number').and.to.be.above(0);
        });

        test('afterCallEnd carries no single message', () => {
          expect(fer.grpc.response.message).to.be.undefined;
        });

        // Deleted once every assertion above has read it: the two sandbox modes share this
        // collection, so a value left behind would let the next mode pass without the hook running.
        fer.deleteVar('unaryGreeting');
