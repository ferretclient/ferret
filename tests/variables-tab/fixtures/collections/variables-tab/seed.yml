info:
  name: seed
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8081/ping

runtime:
  scripts:
    - type: before-request
      code: |-
        // Runtime variables only exist in memory, and a secret env var's value is
        // never written to disk — both have to be seeded by a script run.
        fer.setVar('auth_token', 'runtime-token-1');
        fer.setVar('retry_count', 3);
        fer.setVar('service_config', { region: 'us-east-1', replicas: 2 });

        fer.setEnvVar('api_token', 'sk-live-9f3a');
        fer.setEnvVar('secret_profile', { role: 'admin' });
