info:
  name: 07-triple-phase-trap
  type: http
  seq: 7

http:
  method: GET
  url: http://localhost:8081/api/large-payload?size=3145728

runtime:
  scripts:
    - type: before-request
      code: |-
        const r = await fer.sendRequest({ url: 'http://localhost:8081/api/large-payload?size=3145728', method: 'GET' });
        let preBlob = r.data;
        for (let i = 0; i < 8; i++) {
          preBlob = preBlob + preBlob;
        }
        fer.setVar('preLen', preBlob.length);
    - type: after-response
      code: |-
        let postBlob = res.getBody();
        for (let i = 0; i < 8; i++) {
          postBlob = postBlob + postBlob;
        }
        fer.setVar('postLen', postBlob.length);
    - type: tests
      code: |-
        test('all three phases ran despite each trapping its engine', function() {
          let testBlob = res.getBody();
          for (let i = 0; i < 8; i++) {
            testBlob = testBlob + testBlob;
          }
          expect(testBlob.length).to.be.above(100000000);
          expect(fer.getVar('preLen')).to.be.above(100000000);
          expect(fer.getVar('postLen')).to.be.above(100000000);
        });
